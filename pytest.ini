[tool:pytest]
# Pytest configuration for NYELUX Backend Integration Tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test directories
testpaths = tests/integration

# Markers for categorizing tests
markers =
    critical: Critical tests that must pass for production (Foundation, Security, Multi-tenant)
    high: High priority tests (Core features, AI, Performance)
    medium: Medium priority tests (Supporting features)
    low: Low priority tests
    
    phase1: Phase 1 - Foundation tests (Weeks 1-2)
    phase2: Phase 2 - Core Features tests (Weeks 3-4)
    phase3: Phase 3 - Advanced Features tests (Weeks 5-6)
    phase4: Phase 4 - Integration & Scale tests (Weeks 7-8)
    phase5: Phase 5 - Security & Compliance tests (Weeks 9-10)
    phase6: Phase 6 - UAT & Production tests (Weeks 11-12)
    
    slow: Tests that take more than 5 seconds
    performance: Performance and load tests
    security: Security-related tests
    integration: External service integration tests
    unit: Unit tests (if any)
    
    requires_db: Tests that require database
    requires_redis: Tests that require Redis
    requires_elasticsearch: Tests that require Elasticsearch
    requires_external: Tests that require external services

# Output options
addopts = 
    --strict-markers
    --tb=short
    --disable-warnings
    -ra
    --maxfail=5
    --ff
    --color=yes

# Coverage options
[coverage:run]
source = src
omit = 
    */tests/*
    */migrations/*
    */__init__.py
    */config.py

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Timeout for tests (in seconds)
timeout = 300
timeout_method = thread

# Asyncio configuration
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Parallel execution settings
# Use with: pytest -n auto
[tool:pytest:parallel]
workers = auto
dist = loadscope

# Test order (for dependencies)
# Critical tests run first
[tool:pytest:order]
1 = test_auth_comprehensive.py
2 = test_multi_tenant.py
3 = test_public_access.py
4 = test_device_management.py