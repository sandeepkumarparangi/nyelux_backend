version: '3.8'

services:
  # Load Balancer / Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: nyelux-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - nginx-cache:/var/cache/nginx
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - api1
      - api2
      - api3
    networks:
      - nyelux-network
    restart: unless-stopped

  # API Instance 1
  api1:
    build: .
    container_name: nyelux-api-1
    environment:
      - PORT=8000
      - WORKERS=4
      - ENVIRONMENT=production
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=${DATABASE_URL}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
    depends_on:
      - redis
      - postgres
    networks:
      - nyelux-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

  # API Instance 2
  api2:
    build: .
    container_name: nyelux-api-2
    environment:
      - PORT=8001
      - WORKERS=4
      - ENVIRONMENT=production
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=${DATABASE_URL}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
    depends_on:
      - redis
      - postgres
    networks:
      - nyelux-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

  # API Instance 3
  api3:
    build: .
    container_name: nyelux-api-3
    environment:
      - PORT=8002
      - WORKERS=4
      - ENVIRONMENT=production
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=${DATABASE_URL}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
    depends_on:
      - redis
      - postgres
    networks:
      - nyelux-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

  # Redis Cluster for Caching
  redis:
    image: redis:7-alpine
    container_name: nyelux-redis
    command: redis-server --maxmemory 2gb --maxmemory-policy allkeys-lru --save ""
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - nyelux-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G

  # Redis Sentinel for HA
  redis-sentinel:
    image: redis:7-alpine
    container_name: nyelux-redis-sentinel
    command: redis-sentinel /etc/redis-sentinel/sentinel.conf
    volumes:
      - ./redis-sentinel.conf:/etc/redis-sentinel/sentinel.conf
    depends_on:
      - redis
    networks:
      - nyelux-network
    restart: unless-stopped

  # PostgreSQL (Local cache of critical data)
  postgres:
    image: postgres:15-alpine
    container_name: nyelux-postgres
    environment:
      - POSTGRES_DB=nyelux
      - POSTGRES_USER=nyelux
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_MAX_CONNECTIONS=200
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - nyelux-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G

  # Elasticsearch for Advanced Search (Optional but recommended)
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: nyelux-elasticsearch
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms2g -Xmx2g
      - xpack.security.enabled=false
    volumes:
      - es-data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - nyelux-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G

  # Prometheus for Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: nyelux-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - nyelux-network
    restart: unless-stopped

  # Grafana for Dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: nyelux-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana-dashboards:/etc/grafana/provisioning/dashboards
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - nyelux-network
    restart: unless-stopped

networks:
  nyelux-network:
    driver: bridge

volumes:
  nginx-cache:
  redis-data:
  postgres-data:
  es-data:
  prometheus-data:
  grafana-data:
