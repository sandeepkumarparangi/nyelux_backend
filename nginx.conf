# NGINX Configuration for Ultra-Scale Caching
# Place this in /etc/nginx/sites-available/nyelux-api

# Upstream backend servers (for load balancing)
upstream nyelux_backend {
    least_conn;  # Use least connection method
    server 127.0.0.1:8000 weight=1 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:8001 weight=1 max_fails=3 fail_timeout=30s backup;
    keepalive 32;  # Keep connections alive
}

# Cache configuration
proxy_cache_path /var/cache/nginx/nyelux 
    levels=1:2 
    keys_zone=nyelux_cache:100m 
    max_size=1g 
    inactive=60m 
    use_temp_path=off;

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=search_limit:10m rate=50r/s;

server {
    listen 80;
    listen [::]:80;
    server_name api.nyelux.com;
    
    # Redirect to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.nyelux.com;
    
    # SSL Configuration (update paths)
    ssl_certificate /path/to/ssl/cert.pem;
    ssl_certificate_key /path/to/ssl/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    
    # CORS headers for API
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' always;
    add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml application/atom+xml image/svg+xml text/javascript application/vnd.ms-fontobject application/x-font-ttf font/opentype;
    
    # Ultra-fast typeahead endpoint with aggressive caching
    location /api/v1/public/ultra {
        # Rate limiting
        limit_req zone=search_limit burst=20 nodelay;
        
        # Cache configuration
        proxy_cache nyelux_cache;
        proxy_cache_valid 200 5m;  # Cache successful responses for 5 minutes
        proxy_cache_valid 404 1m;  # Cache 404s for 1 minute
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        
        # Add cache status to response headers
        add_header X-Cache-Status $upstream_cache_status;
        add_header Cache-Control "public, max-age=300";
        
        # Proxy settings
        proxy_pass http://nyelux_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 1s;
        proxy_send_timeout 2s;
        proxy_read_timeout 2s;
        
        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }
    
    # Fast endpoint with shorter cache
    location /api/v1/public/fast {
        limit_req zone=search_limit burst=30 nodelay;
        
        proxy_cache nyelux_cache;
        proxy_cache_valid 200 2m;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_use_stale error timeout updating;
        
        add_header X-Cache-Status $upstream_cache_status;
        
        proxy_pass http://nyelux_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    
    # Regular API endpoints
    location /api/v1/ {
        limit_req zone=api_limit burst=50 nodelay;
        
        proxy_pass http://nyelux_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
    
    # Health check endpoint (no caching)
    location /health {
        access_log off;
        proxy_pass http://nyelux_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    
    # Static files (if any)
    location /static/ {
        alias /var/www/nyelux/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    
    # Default
    location / {
        return 404;
    }
}
